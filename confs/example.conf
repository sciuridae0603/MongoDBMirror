[sync]
# full  : mirror all data from the source to the destination, then exit
# oplog : only mirror operations from the oplog
# auto  : full sync when the oplog position is missing or outdated, then follow the oplog
mode=auto

last_optime_file=logs/example.optime
log_file=logs/example.log
threads=8

source_uri=mongodb://user:user@localhost:27001/?authMechanism=DEFAULT&authSource=admin
destination_uri=mongodb://127.0.0.1:27000

flag_prefix=mongodb_mirror_
delete_documents_not_in_source=true
mirror_indexes=true

# seconds
oplog_pull_interval=60

[monitor]
enabled=false
# database or script
type=script
mirror_key=mongodb_mirror

# for type=database
uri=mongodb://127.0.0.1:27000
database=mongodb_mirror
collection=logs

# for type=script, called with the arguments:
# 1. mirror_key
# 2. current_time
# 3. oplog_queue_size
# 4. last_processed_oplog_timestamp (ms, oplog time of the last applied and saved position)
command=./monitor.example.sh

[mapping]
# *=*                            : mirror all databases
# src_db_1.*=dest_db_1.*         : mirror all collections in src_db_1 to dest_db_1
# src_db_2.data=dest_db_1.data_2 : mirror src_db_2.data to dest_db_1.data_2
# Names are case sensitive
*=*
